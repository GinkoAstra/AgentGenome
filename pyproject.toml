[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentgenome"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["PyYAML"]

[project.scripts]
agentgenome = "cli:main"
agentgenome-sop = "sop.cli:main"

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.packages.find]
include = ["builder*", "core*", "adapters*", "sop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
sop = ["*.mjs", "PROTOCOL.md"]
